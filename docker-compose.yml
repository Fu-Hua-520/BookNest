# BookNest 书籍交流社区 - Docker Compose 编排
# 差异说明（相对 CoderHub）：
#   - 无 MinIO：对象存储改用阿里云 OSS 云服务（OSS_* 环境变量），不落本地
#   - 向量库用 Qdrant（本地容器），不再依赖外部向量云服务
#   - 数据库名为 booknest（对应 user_table.sql）
#   - AI 用 DeepSeek + 阿里云 DashScope（embedding），预留 DEEPSEEK_API_KEY / DASHSCOPE_API_KEY

services:
  # MySQL 数据库（初始化 booknest 库，自动执行 booknest_data/sql 下的建表脚本）
  # ⚠️ 初始化只发生一次：MySQL 官方镜像仅在 /var/lib/mysql 为空（首次启动）时
  #    才执行 /docker-entrypoint-initdb.d 下的脚本。数据目录一旦存在，之后
  #    修改 booknest_data/sql 里的 SQL 再启动都不会生效。
  #    需要重新建库 → 停容器、清空 booknest_data/mysql/data，再启动（见 README/文档）。
  mysql:
    image: mysql:8.0
    container_name: booknest-mysql
    restart: always
    environment:
      MYSQL_DATABASE: booknest          # 初始化数据库名（与 application.yml 的 DB_NAME 对齐）
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Shanghai
      # 关键：容器内 mysql 客户端在 LANG 未设置时默认用 latin1 连接，
      # 执行 /docker-entrypoint-initdb.d 脚本时会把中文双重编码成永久乱码（已实测复现）。
      # 设为 UTF-8 locale 让客户端默认走 utf8mb4；脚本内的 SET NAMES utf8mb4 是第二道保险。
      LANG: C.UTF-8
    ports:
      - "3306:3306"
    volumes:
      - ./booknest_data/mysql/data:/var/lib/mysql            # 数据持久化
      - ./booknest_data/sql:/docker-entrypoint-initdb.d      # 自动执行初始化 SQL（含 user_table.sql）
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    deploy:
      resources:
        limits:
          memory: 512M # 针对 2G 内存进行精细化限制

  # Redis 缓存（带密码，与 REDIS_PASSWORD 对齐）
  redis:
    image: redis:7.0
    container_name: booknest-redis
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - ./booknest_data/redis/data:/data
    deploy:
      resources:
        limits:
          memory: 256M

  # RabbitMQ 消息队列（通知异步解耦，管理界面端口 15672）
  rabbitmq:
    image: rabbitmq:3-management
    container_name: booknest-rabbitmq
    restart: always
    ports:
      - "5672:5672"    # AMQP 协议端口
      - "15672:15672"  # 管理界面端口
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      # 限制内存水位为系统内存的 20%，避免在 2G 机器上 OOM
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "-rabbit vm_memory_high_watermark 0.2"
    volumes:
      - ./booknest_data/rabbitmq/data:/var/lib/rabbitmq
    deploy:
      resources:
        limits:
          memory: 300M

  # Qdrant 向量数据库（RAG 检索用：存帖子正文分块的 embedding）
  qdrant:
    image: qdrant/qdrant:v1.13.0
    container_name: booknest-qdrant
    restart: always
    ports:
      - "6333:6333"    # REST + 内置控制台，浏览器可打开 http://localhost:6333/dashboard
      - "6334:6334"    # gRPC，后端 Java 客户端走这个端口
    volumes:
      - ./booknest_data/qdrant/data:/qdrant/storage
      - ./booknest_data/qdrant/snapshots:/qdrant/snapshots
    environment:
      - QDRANT__STORAGE__STORAGE_PATH=/qdrant/storage
      # 注意：这里故意不设置 QDRANT__SERVICE__API_KEY。
      # 一旦设置该变量，Qdrant 就会要求每个请求带 api-key，届时后端也必须配上 QDRANT_API_KEY。
    deploy:
      resources:
        limits:
          memory: 400M

  # BookNest 后端应用 (Java 17 + Spring Boot)
  app:
    build:
      context: ./booknest_backend
      dockerfile: Dockerfile
    image: booknest-server:latest
    container_name: booknest-app
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - mysql
      - redis
      - rabbitmq
      - qdrant
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      # 数据源（服务名作为容器内 host）
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=booknest
      - DB_USERNAME=root
      - DB_PASSWORD=${DB_PASSWORD}
      # Redis
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      # RabbitMQ
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USERNAME=${RABBITMQ_USERNAME}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
      # JWT（密钥必须注入，TTL/令牌名有 application.yml 默认值兜底）
      - JWT_USER_SECRET=${JWT_USER_SECRET}
      - JWT_USER_TTL=${JWT_USER_TTL:-7200000}
      - JWT_USER_TOKEN_NAME=${JWT_USER_TOKEN_NAME:-authentication}
      - JWT_ADMIN_SECRET=${JWT_ADMIN_SECRET}
      - JWT_ADMIN_TTL=${JWT_ADMIN_TTL:-7200000}
      - JWT_ADMIN_TOKEN_NAME=${JWT_ADMIN_TOKEN_NAME:-admin-authentication}
      # 阿里云 OSS 对象存储（无 MinIO，云服务）
      - OSS_ENDPOINT=${OSS_ENDPOINT}
      - OSS_ACCESS_KEY_ID=${OSS_ACCESS_KEY_ID}
      - OSS_ACCESS_KEY_SECRET=${OSS_ACCESS_KEY_SECRET}
      - OSS_BUCKET_NAME=${OSS_BUCKET_NAME}
      # AI（P4 阶段启用：DeepSeek 对话 + DashScope embedding）
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DASHSCOPE_API_KEY=${DASHSCOPE_API_KEY}
      # RAG（向量库 Qdrant；值为 qdrant 才装配向量相关 Bean，空值即关闭）
      - QDRANT_VECTORSTORE_TYPE=${QDRANT_VECTORSTORE_TYPE:-qdrant}
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6334
      - RAG_HOT_TOP_N=${RAG_HOT_TOP_N:-100}
      - RAG_REFRESH_INTERVAL=${RAG_REFRESH_INTERVAL:-P30D}
      - RAG_REFRESH_INITIAL_DELAY=${RAG_REFRESH_INITIAL_DELAY:-PT2M}
    deploy:
      resources:
        limits:
          memory: 800M

  # BookNest 前端应用 (Vue 3 + Vite + Nginx)
  # 说明：booknest_frontend/ 已就绪，本服务为启用状态（多阶段构建 → Nginx 托管，映射 80 端口）。
  # 注意：前端目录缺 .dockerignore，`COPY . .` 会把宿主的 node_modules / .env.local / dist 一并复制进镜像。
  web:
     build:
       context: ./booknest_frontend
       dockerfile: Dockerfile
     image: booknest-web:latest
     container_name: booknest-web
     restart: always
     ports:
       - "80:80"        # 映射公网 80 端口（HTTP 默认端口）
     depends_on:
       - app            # 确保后端先启动
     deploy:
       resources:
         limits:
           memory: 300M # 前端运行期（Nginx）占内存极小，主要是构建期占内存
