# BookNest 前端 Nginx 配置
# 静态资源托管 + /api 反代后端 + /ws 反代 WebSocket + SPA history 回退
server {
    listen       80;
    server_name  localhost;

    charset utf-8;
    root   /usr/share/nginx/html;
    index  index.html;

    # 开启 gzip，压缩静态资源
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml image/svg+xml;
    gzip_vary on;

    # 带 hash 的构建产物长期缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 后端业务接口
    location /api/ {
        proxy_pass http://app:8080/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 流式对话必需：关闭缓冲、放宽超时
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        chunked_transfer_encoding on;
    }

    # 私信 WebSocket 升级
    location /ws/ {
        proxy_pass http://app:8080/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;
        proxy_read_timeout 3600s;
    }

    # SPA 路由回退：/post/xxx、/booklist/xxx 等前端路由直接访问不 404
    location / {
        try_files $uri $uri/ /index.html;
    }
}
