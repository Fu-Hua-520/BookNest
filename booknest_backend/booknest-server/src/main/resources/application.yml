# BookNest 后端骨架配置
# 所有敏感信息均通过环境变量注入（.env 风格），此处仅提供占位符与默认值
spring:
  application:
    name: booknest-server
  # 文件上传配置 - 支持大文件（书籍封面/帖子正文）
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  # Jackson 日期格式配置
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    serialization:
      write-dates-as-timestamps: false
  # 数据源配置（Druid 连接池 + MySQL 驱动）
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:booknest}?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  # Redis 配置
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      password: ${REDIS_PASSWORD:}
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: 100ms
  # RabbitMQ 配置
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:}
    virtual-host: ${RABBITMQ_VHOST:/}
    listener:
      simple:
        acknowledge-mode: auto  # 自动确认（消费成功后自动删除消息）
        retry:
          enabled: true
          initial-interval: 3000  # 首次重试间隔 3 秒
          max-attempts: 3         # 最多重试 3 次
          multiplier: 2.0         # 重试间隔翻倍（3s → 6s → 12s）
  # Spring AI 模型配置
  ai:
    # 模型类型选择：显式指定默认对话模型为 DeepSeek。
    # DeepSeek 与 OpenAI 两个 starter 均会自动装配 ChatModel（matchIfMissing=true），
    # 若不指定会导致注入 ChatModel / ChatClient.Builder 时出现多 Bean 冲突。
    model:
      chat: deepseek
    # DeepSeek 对话模型（原生 starter）
    deepseek:
      api-key: ${DEEPSEEK_API_KEY:}
      chat:
        options:
          model: deepseek-chat
          temperature: 0.7
    # 阿里云 DashScope embedding（OpenAI 兼容协议）
    openai:
      api-key: ${DASHSCOPE_API_KEY:}
      base-url: https://dashscope.aliyuncs.com/compatible-mode/v1
      embedding:
        options:
          model: text-embedding-v3
    # 向量库 Qdrant —— 由 spring-ai-starter-vector-store-qdrant 自动装配，
    # 启动时会自动创建 QdrantClient 与 VectorStore 两个 Bean（维度取自上面的 text-embedding-v3）。
    vectorstore:
      # 单选器：值必须是 qdrant 才装配；留空则不装配任何向量库，Qdrant 没起来也不影响启动
      type: ${QDRANT_VECTORSTORE_TYPE:}
      qdrant:
        host: ${QDRANT_HOST:localhost}
        port: ${QDRANT_PORT:6334}
        collection-name: ${RAG_COLLECTION:booknest_posts}
        # 这里刻意不写 api-key：留空会在鉴权判断里变成空字符串而非 null，
        # 导致客户端照样发出一个空的 api-key 头。本地 Qdrant 不开鉴权，不配最干净。
        # 若将来接 Qdrant Cloud，再加 api-key: ${QDRANT_API_KEY} 即可。

server:
  port: ${SERVER_PORT:8080}
  tomcat:
    uri-encoding: UTF-8

# MyBatis 配置
mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.fuhua.booknest.pojo.entity
  configuration:
    map-underscore-to-camel-case: true

# PageHelper 分页插件配置
pagehelper:
  helper-dialect: mysql
  reasonable: true
  support-methods-arguments: true
  params: count=countSql

# SpringDoc OpenAPI 配置
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

# 日志级别配置
logging:
  level:
    com.fuhua.booknest: info
    org.springframework: info

# BookNest JWT 配置（对应 JwtProperties，prefix=booknest.jwt）
booknest:
  jwt:
    # 用户端（默认值仅供本地开发，生产环境务必通过环境变量覆盖）
    user-secret-key: ${JWT_USER_SECRET:booknest-dev-user-secret-key-change-me-in-prod}
    user-ttl: ${JWT_USER_TTL:7200000}
    user-token-name: ${JWT_USER_TOKEN_NAME:authentication}
    # 后台管理端（默认值仅供本地开发，生产环境务必通过环境变量覆盖）
    admin-secret-key: ${JWT_ADMIN_SECRET:booknest-dev-admin-secret-key-change-me-in-prod}
    admin-ttl: ${JWT_ADMIN_TTL:7200000}
    admin-token-name: ${JWT_ADMIN_TOKEN_NAME:admin-authentication}
  # 阿里云 OSS 配置（对应 AliOssProperties，prefix=booknest.alioss）
  alioss:
    endpoint: ${OSS_ENDPOINT:}
    access-key-id: ${OSS_ACCESS_KEY_ID:}
    access-key-secret: ${OSS_ACCESS_KEY_SECRET:}
    bucket-name: ${OSS_BUCKET_NAME:}
  # BookNest RAG 业务参数（与向量库选型无关的纯业务配置）
  rag:
    # 语料范围：只索引「点赞量前 N 的已发布且已过审帖子」。
    # 向量库里只保留这 N 篇的分块，检索也只在这 N 篇里找答案。
    hot-top-n: ${RAG_HOT_TOP_N:100}
    # 全量重建周期：默认 30 天。写 ISO-8601 时长（P30D / PT12H / PT30M）
    # 或直接写毫秒数都可以。到点后清空集合，再重新拉一遍热门帖入库。
    refresh-interval: ${RAG_REFRESH_INTERVAL:P30D}
    # 启动后延迟多久做第一次重建，留点时间给 MySQL / Qdrant 就绪
    refresh-initial-delay: ${RAG_REFRESH_INITIAL_DELAY:PT2M}
    # 批量入库时每处理 N 篇打印一次进度日志，设为 0 以下则关闭进度日志
    batch-log-interval: ${RAG_BATCH_LOG_INTERVAL:50}
