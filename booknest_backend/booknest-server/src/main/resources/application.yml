# BookNest 后端骨架配置
# 所有敏感信息均通过环境变量注入（.env 风格），此处仅提供占位符与默认值
spring:
  application:
    name: booknest-server
  # 文件上传配置 - 支持大文件（书籍封面/帖子正文）
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB
  # Jackson 日期格式配置
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    serialization:
      write-dates-as-timestamps: false
  # 数据源配置（Druid 连接池 + MySQL 驱动）
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:booknest}?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  # Redis 配置
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      password: ${REDIS_PASSWORD:}
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: 100ms
  # RabbitMQ 配置
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:}
    virtual-host: ${RABBITMQ_VHOST:/}
    # 生产端可靠投递：让「发丢了」这件事变可见
    # correlated：开启 confirm 回调并带回 correlationData，回调里才能定位是哪条消息
    # returns + mandatory：消息到了交换机但路由不到任何队列时回调 ReturnsCallback，
    # 否则这种情况会被 broker 静默丢弃（最常见的丢消息场景：队列被误删/绑定丢失）
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        acknowledge-mode: auto  # 自动确认（消费成功后自动删除消息）
        # 并发消费：通知落库是纯 DB 写，单线程消费会在秒杀式点赞/评论高峰时排队积压。
        # 上限不宜过高 —— 消费者是和业务共用同一个 Druid 连接池的，
        # 拉太高会把连接池抢空，反而拖慢真正的业务请求。
        concurrency: ${RABBITMQ_CONCURRENCY:2}
        max-concurrency: ${RABBITMQ_MAX_CONCURRENCY:4}
        # 每个消费者一次预取 10 条：配合手动并发度做批量流水线，
        # 同时避免一次性把整队列拉进内存（prefetch 过大等于关掉流量控制）
        prefetch: ${RABBITMQ_PREFETCH:10}
        retry:
          enabled: true
          initial-interval: 3000  # 首次重试间隔 3 秒
          max-attempts: 3         # 最多重试 3 次
          multiplier: 2.0         # 重试间隔翻倍（3s → 6s → 12s）
  # Spring AI 配置：只保留 OpenAI 兼容模块，供「评论区 AI 机器人」使用。
  # 机器人的厂商 / base-url / 模型 / API Key 全部由用户在运行时填写，
  # 因此这里没有任何 api-key —— 实例在 AiBotChatClientFactory 里按机器人配置动态构建：
  #   OpenAiApi.builder().baseUrl(不含 /v1).apiKey(...)  →  OpenAiChatModel  →  ChatClient
  #
  # ⚠️ 下面这些开关**一个都不能漏**。
  # classpath 上有 spring-ai-starter-model-openai，它的每一类自动装配
  # （chat / embedding / image / moderation / audio.speech / audio.transcription）
  # 默认都是 matchIfMissing=true，于是都会来创建 Bean；而这些 Bean 全都要求
  # spring.ai.openai.api-key —— 本项目没有 Key（Key 是用户运行时自填的），
  # 任何一个漏关都会让整个应用启动失败、容器 Exited(1)。
  # 真实翻车记录：只关了 chat/embedding，结果 openAiAudioSpeechModel 抛
  # "OpenAI API key must be set" 直接把 Spring 上下文拉死。
  # 取值只要不是 "openai" 即可，none 是官方约定的关闭写法；
  # 完整开关清单见 spring-ai-model 的 SpringAIModelProperties。
  ai:
    model:
      chat: none
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none

server:
  port: ${SERVER_PORT:8080}
  tomcat:
    uri-encoding: UTF-8

# MyBatis 配置
mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.fuhua.booknest.pojo.entity
  configuration:
    map-underscore-to-camel-case: true

# PageHelper 分页插件配置
pagehelper:
  helper-dialect: mysql
  reasonable: true
  support-methods-arguments: true
  params: count=countSql

# SpringDoc OpenAPI 配置
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

# 日志级别配置
logging:
  level:
    com.fuhua.booknest: info
    org.springframework: info

# BookNest JWT 配置（对应 JwtProperties，prefix=booknest.jwt）
booknest:
  jwt:
    # 用户端（默认值仅供本地开发，生产环境务必通过环境变量覆盖）
    user-secret-key: ${JWT_USER_SECRET:booknest-dev-user-secret-key-change-me-in-prod}
    user-ttl: ${JWT_USER_TTL:7200000}
    user-token-name: ${JWT_USER_TOKEN_NAME:authentication}
    # 后台管理端（默认值仅供本地开发，生产环境务必通过环境变量覆盖）
    admin-secret-key: ${JWT_ADMIN_SECRET:booknest-dev-admin-secret-key-change-me-in-prod}
    admin-ttl: ${JWT_ADMIN_TTL:7200000}
    admin-token-name: ${JWT_ADMIN_TOKEN_NAME:admin-authentication}
  # 阿里云 OSS 配置（对应 AliOssProperties，prefix=booknest.alioss）
  alioss:
    endpoint: ${OSS_ENDPOINT:}
    access-key-id: ${OSS_ACCESS_KEY_ID:}
    access-key-secret: ${OSS_ACCESS_KEY_SECRET:}
    bucket-name: ${OSS_BUCKET_NAME:}
  # 上传限流：单用户每分钟最多上传多少个文件（防止已登录用户刷 OSS 流量/存储）
  upload:
    rate-limit-per-minute: ${UPLOAD_RATE_LIMIT_PER_MINUTE:20}
  # 计数缓冲（浏览/点赞/评论/收藏先在 Redis 累加，再定时批量落 MySQL）
  # 对应 CountFlushJob 上的 @Scheduled，见该类的注释
  count-buffer:
    # 落库间隔（毫秒）。调小 → 计数更实时但 UPDATE 更碎；调大 → 相反。
    # 注意：这决定的是「MySQL 里的值最多落后多久」，不影响页面展示
    #（展示值 = 行里的值 + 缓冲增量，永远是最新的）。
    flush-interval-ms: ${COUNT_FLUSH_INTERVAL_MS:30000}
