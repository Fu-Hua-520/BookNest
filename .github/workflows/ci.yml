# BookNest 书籍交流社区 - CI/CD 流水线
#
# 触发时机：
#   - push 到 master：编译 → 构建 Docker 镜像 → 推送镜像 → SSH 部署
#   - PR 到 master：仅编译验证（不推送、不部署）
#
# 需在 GitHub 仓库 Settings → Secrets and variables → Actions 配置以下 secrets：
#   DOCKER_USERNAME / DOCKER_PASSWORD   # Docker Registry 账号（镜像推送）
#   SSH_HOST / SSH_USERNAME / SSH_KEY   # 服务器 SSH 登录信息（部署）
#   DEPLOY_PATH                         # 服务器上 docker-compose.yml 所在目录（绝对路径）
#
# 注意：应用运行期的敏感配置（DB/REDIS/RABBITMQ/OSS/JWT/AI key）不进镜像，
#       统一由服务器上的 .env 文件提供，由 docker compose 注入容器。

name: BookNest CI/CD

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  # ==================== 编译验证（每次 push / PR 都执行）====================
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Maven 打包（跳过测试）
        run: mvn -B -f booknest_backend/pom.xml clean package -DskipTests

  # ==================== 镜像构建 + 部署（仅 master 分支 push 时执行）====================
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Registry
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 构建并推送后端镜像
        uses: docker/build-push-action@v5
        with:
          context: ./booknest_backend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/booknest-server:latest

      - name: SSH 部署到服务器
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            docker compose pull app
            docker compose up -d app
